<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>재입고 안내</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body { background: #f7fbf7; color: #263c31; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
      .notice { width: 860px; min-height: 1493px; padding: 134px 65px 120px; }
      .title { height: 120px; display: flex; align-items: center; justify-content: center; background: #2e5b42; border-radius: 14px 14px 0 0; color: #fff; font-size: 46px; font-weight: 700; letter-spacing: 0; }
      .content { margin-top: 72px; font-size: 30px; font-weight: 500; line-height: 1.72; letter-spacing: -0.2px; }
      p { margin: 0 0 43px; }
      .emphasis { font-weight: 700; }
      .arrival { margin-top: 63px; }
      mark { padding: 0 4px 2px; background: #e8f34c; color: inherit; font: inherit; }
      .closing { margin-top: 58px; }
    </style>
  </head>
  <body>
    <main class="notice">
      <header class="title">재입고 안내</header>
      <section class="content">
        <p>죄송합니다<br />현재 재고 7개 남아 있습니다.<br /><strong>3+1 옵션은 곧 구매제한 될 수 있습니다</strong></p>
        <p>현재 블로그, 카페, 쓰레드 등<br />여러 커뮤니티에서 후기 보고<br />찾아주시는 분들이 많아지면서</p>
        <p class="emphasis">온라인 보다 에스테틱, 피부관리실 쪽에<br />물량이 먼저 배당되다 보니</p>
        <p>온라인 주문 속도를 못 따라가고 있습니다.</p>
        <p class="arrival">다음 <strong>입고 예정일은 <mark id="restock-date">계산 중</mark></strong>이며<br />제조팀 24시간 가동중입니다.</p>
        <p class="closing">이 글이 보인다면 구매 가능합니다.<br />감사합니다.</p>
      </section>
    </main>
    <script>
      const today = new Date();
      const start = new Date(today);
      const end = new Date(today);
      start.setDate(today.getDate() + 10);
      end.setDate(today.getDate() + 13);
      const startText = `${start.getMonth() + 1}/${start.getDate()}`;
      const endText = start.getMonth() === end.getMonth() ? `${end.getDate()}일` : `${end.getMonth() + 1}/${end.getDate()}일`;
      document.getElementById('restock-date').textContent = `${startText}~${endText}`;
    </script>
  </body>
</html>
