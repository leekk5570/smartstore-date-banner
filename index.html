<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>재입고 안내</title>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body { background: #f7fbf7; color: #354c3e; font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
      .notice { position: relative; width: 1000px; height: 1737px; overflow: hidden; }
      .title { position: absolute; top: 156px; left: 63px; width: 881px; height: 143px; display: flex; align-items: center; justify-content: center; background: #2a503a; border-radius: 22px 22px 0 0; color: #fff; font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: 0; }
      .content { font-size: 44px; font-weight: 500; line-height: 1.62; letter-spacing: -1.8px; }
      p { position: absolute; left: 63px; margin: 0; }
      .intro { top: 385px; }
      .community { top: 668px; }
      .emphasis { top: 948px; font-weight: 700; }
      .online { top: 1090px; }
      .arrival { top: 1228px; }
      .closing { top: 1438px; }
      mark { display: inline-block; padding: 0 8px 2px; border-radius: 9px; background: #dbea37; color: inherit; font: inherit; line-height: 1.35; }
    </style>
  </head>
  <body>
    <main class="notice">
      <header class="title">재입고 안내</header>
      <section class="content">
        <p class="intro">죄송합니다<br />현재 재고 7개 남아 있습니다.<br /><strong>3+1 옵션은 곧 구매제한 될 수 있습니다</strong></p>
        <p class="community">현재 블로그, 카페, 쓰레드 등<br />여러 커뮤니티에서 후기 보고<br />찾아주시는 분들이 많아지면서</p>
        <p class="emphasis">온라인 보다 에스테틱, 피부관리실 쪽에<br />물량이 먼저 배당되다 보니</p>
        <p class="online">온라인 주문 속도를 못 따라가고 있습니다.</p>
        <p class="arrival">다음 <mark><strong>입고 예정일은 <span id="restock-date">계산 중</span></strong></mark>이며<br />제조팀 24시간 가동중입니다.</p>
        <p class="closing">이 글이 보인다면 구매 가능합니다.<br />감사합니다.</p>
      </section>
    </main>
    <script>
      const today = new Date();
      const start = new Date(today);
      const end = new Date(today);
      start.setDate(today.getDate() + 10);
      end.setDate(today.getDate() + 13);
      const startText = `${start.getMonth() + 1}/${start.getDate()}`;
      const endText = start.getMonth() === end.getMonth() ? `${end.getDate()}일` : `${end.getMonth() + 1}/${end.getDate()}일`;
      document.getElementById('restock-date').textContent = `${startText}~${endText}`;
    </script>
  </body>
</html>
