name: Update restock notice

on:
  schedule:
    - cron: '5 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4
      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image tools
        run: npm install puppeteer
      - name: Create today's notice image
        run: node generate-image.js
      - name: Save the updated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add restock-notice.png
          git diff --staged --quiet || git commit -m "Update restock notice - $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git push
